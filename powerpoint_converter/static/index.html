<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerPoint Converter</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div id="titlebar">
  <span class="brand">PowerPoint Converter</span>
  <span class="crumbs" id="crumbs"></span>
  <span class="spacer"></span>
  <span class="saved" id="saved"></span>
</div>

<!-- 一覧 -->
<main id="list" class="hidden">
  <div id="listBody"></div>
  <div id="drop">PowerPoint の資料（.pptx・.ppt・.odp）をここへドラッグ＆ドロップすると、このフォルダに取り込む（クリックして選んでもよい）</div>
  <input type="file" id="dropFile" accept=".pptx,.pptm,.potx,.ppt,.pps,.ppsx,.odp,.fodp,.key" multiple class="hidden">
</main>

<!-- 編集（PowerPoint と同じ並び） -->
<main id="editor" class="hidden">
  <div id="ribbon">
    <div class="grp">
      <button id="bUndo" title="元に戻す (Ctrl+Z)"><span class="ico">↶</span></button>
      <button id="bRedo" title="やり直し (Ctrl+Y)"><span class="ico">↷</span></button>
    </div>
    <div class="grp">
      <button id="bPaste" title="貼り付け (Ctrl+V)"><span class="ico">📋</span><span class="lbl">貼り付け</span></button>
      <button id="bCut" title="切り取り (Ctrl+X)"><span class="ico">✂</span></button>
      <button id="bCopy" title="コピー (Ctrl+C)"><span class="ico">⎘</span></button>
    </div>
    <div class="grp">
      <button id="bNewSlide" title="新しいスライド（レイアウトを選ぶ） Ctrl+M"><span class="ico">＋</span><span class="lbl">新しいスライド</span> ▾</button>
    </div>
    <div class="grp">
      <button id="bTextbox" title="テキスト ボックス"><span class="ico">𝐓</span><span class="lbl">テキスト ボックス</span></button>
      <button id="bShape" title="図形"><span class="ico">◇</span><span class="lbl">図形</span> ▾</button>
      <button id="bTable" title="表"><span class="ico">▦</span><span class="lbl">表</span> ▾</button>
      <button id="bImage" title="画像（貼り付け・ドロップでも入る）"><span class="ico">🖼</span><span class="lbl">画像</span></button>
      <input type="file" id="imageFile" accept="image/png,image/jpeg,image/gif" class="hidden">
    </div>
    <div class="grp">
      <button id="bArrange" title="配置（整列・回転・グループ・重なりの順番）"><span class="ico">⊞</span><span class="lbl">配置</span> ▾</button>
      <button id="bDup" title="複製 (Ctrl+D)"><span class="ico">⧉</span></button>
      <button id="bDel" title="削除 (Delete)"><span class="ico">🗑</span></button>
    </div>
    <div class="grp">
      <button id="bFind" title="検索と置換 (Ctrl+F / Ctrl+H)"><span class="ico">🔍</span><span class="lbl">検索</span></button>
    </div>
    <div class="grp">
      <button id="bShowStart" class="ppt" title="最初から (F5)"><span class="ico">▶</span><span class="lbl">最初から</span></button>
      <button id="bShowCur" title="このスライドから (Shift+F5)"><span class="ico">▷</span><span class="lbl">このスライドから</span></button>
    </div>
    <div class="grp">
      <button id="bDownload" title="ダウンロード（PPTX・PDF・このスライドの画像）"><span class="ico">⤓</span><span class="lbl">ダウンロード</span> ▾</button>
    </div>
  </div>
  <div id="banner"></div>
  <div id="work">
    <aside id="thumbs"></aside>
    <section id="center">
      <div id="findbar" class="hidden">
        <input id="findQ" placeholder="検索する文字">
        <button id="findCase" title="大文字と小文字を区別する">Aa</button>
        <button id="findPrev" title="前へ (Shift+Enter)">▲</button>
        <button id="findNext" title="次へ (Enter)">▼</button>
        <span class="count" id="findCount"></span>
        <input id="findR" placeholder="置換後の文字">
        <button id="findRep" title="いま選んでいる箇所（図形）を置換">置換</button>
        <button id="findAll" title="すべてのスライドとノートで置換">すべて置換</button>
        <span class="res" id="findRes"></span>
        <span style="flex:1"></span>
        <button id="findClose" title="閉じる (Esc)">✕</button>
      </div>
      <div id="stage"><div id="slide"></div><div id="rendering" class="hidden"><span class="spin"></span> 描画中</div></div>
      <div id="notesbar" title="ドラッグで高さを変える">ノート</div>
      <textarea id="notes" placeholder="クリックしてノートを入力"></textarea>
    </section>
    <aside id="pane">
      <div class="tabs">
        <button data-tab="format" class="on">書式</button>
        <button data-tab="anim">アニメーション</button>
        <button data-tab="trans">画面切替</button>
        <button data-tab="select">選択</button>
      </div>
      <div class="body" id="paneBody"></div>
    </aside>
  </div>
  <div id="status">
    <button id="tThumbs" title="スライド一覧を出す・隠す">◧</button>
    <span id="stSlide"></span>
    <span id="stRender"></span>
    <span class="sp"></span>
    <span id="stFonts"></span>
    <button id="zOut" title="縮小">−</button>
    <button id="zFit" title="ウィンドウに合わせる">合わせる</button>
    <button id="zIn" title="拡大">＋</button>
    <span id="stZoom"></span>
    <button id="tPane" title="作業ウィンドウを出す・隠す">◨</button>
  </div>
</main>

<div id="show" class="hidden">
  <button class="close" id="showClose">✕ 終了 (Esc)</button>
  <div class="wait" id="showWait"></div>
  <iframe id="showFrame" class="hidden" title="スライドショー"></iframe>
  <div id="showEnd" class="hidden">スライド ショーの最後です。クリックすると終了します。</div>
</div>
<div id="toast" class="hidden"></div>

<!-- 読み込む順番に意味がある（後のファイルが前のファイルの関数を使う） -->
<script src="/static/js/base.js"></script>
<script src="/static/js/list.js"></script>
<script src="/static/js/deck.js"></script>
<script src="/static/js/canvas.js"></script>
<script src="/static/js/text.js"></script>
<script src="/static/js/commands.js"></script>
<script src="/static/js/pane.js"></script>
<script src="/static/js/dialogs.js"></script>
<script src="/static/js/show.js"></script>
<script src="/static/js/main.js"></script>
</body>
</html>
